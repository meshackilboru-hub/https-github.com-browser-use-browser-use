<style>
/* Layout: study desk. A fixed rail of sections on wide screens (bottom tabs on phones) beside one working pane. */
:root{
  --paper:#F2F5F7; --surface:#FFFFFF; --sunk:#E8EDF0; --ink:#13212A; --muted:#5A6B76; --line:#D6DEE3;
  --accent:#0F6E66; --accent-ink:#FFFFFF; --accent-soft:#DCEFEC;
  --good:#16803C; --good-soft:#E1F3E7; --bad:#B42318; --bad-soft:#FBE7E5; --warn-soft:#FFF4DB;
  --f-display:"Bricolage Grotesque","Space Grotesk",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px; --rail:228px; --tabbar:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0D1418; --surface:#141F25; --sunk:#0F181D; --ink:#E2EAEE; --muted:#8FA1AC; --line:#24343D;
  --accent:#3FC2AF; --accent-ink:#06201C; --accent-soft:#123630;
  --good:#5AD48A; --good-soft:#123222; --bad:#F2857A; --bad-soft:#3A1A17; --warn-soft:#3A2E12; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D1418; --surface:#141F25; --sunk:#0F181D; --ink:#E2EAEE; --muted:#8FA1AC; --line:#24343D;
  --accent:#3FC2AF; --accent-ink:#06201C; --accent-soft:#123630;
  --good:#5AD48A; --good-soft:#123222; --bad:#F2857A; --bad-soft:#3A1A17; --warn-soft:#3A2E12; color-scheme:dark}

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:var(--rail) 1fr;height:100%}

/* rail */
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;padding:18px 12px;padding-left:max(12px,env(safe-area-inset-left,0px))}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.brand b{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em;display:block;line-height:1}
.brand small{color:var(--muted);font-size:12px}
.nav{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:500;text-decoration:none}
.nav svg{flex:none}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.nav:hover{color:var(--ink)}
.rail .who{margin-top:auto;font-size:12.5px;color:var(--muted);padding:8px 10px;border-top:1px solid var(--line)}

main{min-width:0;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:860px;width:100%;margin:0 auto;padding-block:26px 40px;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:-.01em;margin:0;text-wrap:balance;line-height:1.15}
h2{font-family:var(--f-display);font-weight:600;font-size:19px;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:0;max-width:62ch}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:13px}
.err{color:var(--bad)}
.banner{border-radius:10px;padding:10px 14px;font-size:14px;background:var(--warn-soft)}
.banner.bad{background:var(--bad-soft)} .banner.info{background:var(--accent-soft)}

/* controls */
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center;text-decoration:none;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{background:transparent;color:var(--ink);border-color:var(--line);font-weight:500}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
input[type=text],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
textarea{resize:vertical;line-height:1.45}
label.field{display:flex;flex-direction:column;gap:6px}
label.field>span{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px;overflow-x:auto}
.seg button{flex:1;border:0;background:transparent;padding:7px 12px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}

/* library */
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.docs{display:flex;flex-direction:column;gap:8px}
.doc{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.doc:hover{border-color:var(--accent)}
.doc .ic{flex:none;width:40px;height:40px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent);font-family:var(--f-mono);font-size:11px;font-weight:500}
.doc .t{flex:1;min-width:0}
.doc .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.status-error{color:var(--bad)}

/* summary */
.kp{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.sec{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:4px}
.sec .pg{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.gl dt{font-weight:600}.gl dd{margin:0 0 8px}
.mastery-row{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}

/* questions */
.q{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:18px;display:flex;flex-direction:column;gap:12px}
.q .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12px}
.q .concept{color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.q .due{color:var(--bad);font-weight:600}
.q .stem{font-weight:500;font-size:16px;margin:0;white-space:pre-wrap}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;cursor:pointer}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice:disabled{cursor:default}
.choice .k{flex:none;font-family:var(--f-mono);font-weight:500;width:22px;height:22px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;background:var(--surface)}
.choice.right{border-color:var(--good);background:var(--good-soft)}
.choice.right .k{background:var(--good);border-color:var(--good);color:var(--surface)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.result{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.verdict{font-weight:700}
.verdict.correct{color:var(--good)}.verdict.partial{color:var(--accent)}.verdict.incorrect{color:var(--bad)}
.correction{background:var(--bad-soft);border-radius:10px;padding:10px 12px}
.pearl{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:14px}

/* chat */
.chat{display:flex;flex-direction:column;min-height:0;flex:1}
.thread{display:flex;flex-direction:column;gap:16px;padding-block:6px}
.msg{display:flex;gap:12px;min-width:0}
.msg.user{justify-content:flex-end}
.msg.user .bubble{background:var(--accent-soft);border-radius:14px 14px 4px 14px;padding:10px 14px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}
.av{flex:none;width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--paper);font-family:var(--f-display);font-weight:800;display:grid;place-items:center}
.body{min-width:0;flex:1}
.composer{position:sticky;bottom:0;background:var(--paper);padding-block:10px;display:flex;gap:8px;align-items:flex-end;border-top:1px solid var(--line)}
.composer textarea{min-height:46px;max-height:180px;resize:none}
.thinking{color:var(--muted);font-style:italic}
.src{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}

.md{overflow-wrap:anywhere}
.md>*:first-child{margin-top:0}.md>*:last-child{margin-bottom:0}
.md p,.md ul,.md ol{margin:0 0 10px}.md ul,.md ol{padding-left:22px}
.md h1,.md h2,.md h3{font-family:var(--f-display);font-size:17px;margin:14px 0 6px}
.md code{font-family:var(--f-mono);font-size:.9em;background:var(--sunk);padding:1px 5px;border-radius:4px}
.md pre{background:var(--sunk);padding:10px;border-radius:8px;overflow-x:auto}
.md table{border-collapse:collapse;font-size:13.5px;display:block;overflow-x:auto;margin:0 0 10px}
.md th,.md td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
.md th{background:var(--sunk)}
.md blockquote{margin:0 0 10px;border-left:3px solid var(--accent);padding-left:12px;color:var(--muted)}

/* videos */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.vcard{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-decoration:none;color:var(--ink)}
.vcard:hover{border-color:var(--accent)}
.vcard .play{flex:none;width:38px;height:38px;border-radius:50%;background:var(--bad);display:grid;place-items:center}
.vcard small{display:block;color:var(--muted)}

/* onboarding */
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.role{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.role:hover,.role[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.role b{font-family:var(--f-display);font-size:17px}
.sugg{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;margin-top:4px}
.sugg button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:9px 12px;cursor:pointer}
.sugg button:last-child{border-bottom:0}
.sugg button:hover{background:var(--sunk)}
.sugg small{color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.tabbar{display:none}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
@media (max-width:860px){
  .app{grid-template-columns:1fr;height:auto;min-height:100%}
  .rail{display:none}
  main{overflow:visible;padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px))}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;color:var(--muted);text-decoration:none}
  .tabbar a[aria-current="page"]{color:var(--accent);font-weight:600}
  .composer{bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px))}
  .grid2{grid-template-columns:1fr}
  h1{font-size:24px}
}
</style>

/* ================= storage: private per person, or this visit only ================= */
function memoryStore() {
  const docs = new Map(), chunks = new Map(), qs = new Map(), docL = new Set(), qL = new Map();
  let profile = null;
  const emitDocs = () => { const list = [...docs.values()].sort((a, b) => b.createdAt - a.createdAt); docL.forEach((f) => f(list)); };
  const emitQ = (id) => { const list = [...(qs.get(id)?.values() ?? [])].sort((a, b) => b.createdAt - a.createdAt); (qL.get(id) ?? new Set()).forEach((f) => f(list)); };
  return {
    kind: "memory",
    async getProfile() { return profile; },
    async setProfile(p) { profile = p; },
    watchDocs(cb) { docL.add(cb); emitDocs(); return () => docL.delete(cb); },
    async setDoc(id, d) { docs.set(id, { id, ...d }); emitDocs(); },
    async updateDoc(id, d) { const cur = docs.get(id); if (!cur) return; docs.set(id, deepMerge(cur, d)); emitDocs(); },
    async setChunk(id, i, d) { if (!chunks.has(id)) chunks.set(id, []); chunks.get(id)[i] = d; },
    async getChunks(id) { return (chunks.get(id) ?? []).filter(Boolean); },
    watchQuestions(id, cb) { if (!qL.has(id)) qL.set(id, new Set()); qL.get(id).add(cb); emitQ(id); return () => qL.get(id).delete(cb); },
    async addQuestion(id, q) { if (!qs.has(id)) qs.set(id, new Map()); const qid = uid8(); qs.get(id).set(qid, { id: qid, ...q }); emitQ(id); },
    async updateQuestion(id, qid, d) { const m = qs.get(id); if (!m?.has(qid)) return; m.set(qid, { ...m.get(qid), ...d }); emitQ(id); },
    async deleteDoc(id) { docs.delete(id); chunks.delete(id); qs.delete(id); emitDocs(); emitQ(id); },
  };
}
function deepMerge(a, b) {
  const out = { ...a };
  for (const [k, v] of Object.entries(b)) out[k] = v && typeof v === "object" && !Array.isArray(v) && a[k] && typeof a[k] === "object" && !Array.isArray(a[k]) ? deepMerge(a[k], v) : v;
  return out;
}
function dbStore(db, uid) {
  const root = db.doc(`data/users/${uid}/lib`);
  const col = root.collection("docs");
  const profileRef = db.doc(`data/users/${uid}/profile`);
  const snapList = (snap) => snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  return {
    kind: "db",
    async getProfile() { const s = await profileRef.get(); return s.exists ? s.data() : null; },
    setProfile(p) { return profileRef.set(p); },
    watchDocs(cb, err) { return col.orderBy("createdAt", "desc").onSnapshot((s) => cb(snapList(s)), err); },
    setDoc(id, d) { return col.doc(id).set(d); },
    updateDoc(id, d) { return col.doc(id).update(d); },
    setChunk(id, i, d) { return col.doc(id).collection("chunks").doc("c" + String(i).padStart(4, "0")).set(d); },
    async getChunks(id) { const s = await col.doc(id).collection("chunks").get(); return s.docs.map((d) => d.data()).sort((a, b) => a.i - b.i); },
    watchQuestions(id, cb, err) { return col.doc(id).collection("questions").orderBy("createdAt", "desc").onSnapshot((s) => cb(snapList(s)), err); },
    addQuestion(id, q) { return col.doc(id).collection("questions").add(q); },
    updateQuestion(id, qid, d) { return col.doc(id).collection("questions").doc(qid).update(d); },
    async deleteDoc(id) {
      const d = col.doc(id);
      for (const sub of ["chunks", "questions"]) { const s = await d.collection(sub).get(); for (const x of s.docs) await d.collection(sub).doc(x.id).delete(); }
      await d.delete();
    },
  };
}

function serial(key, fn) { const p = (writeChains.get(key) ?? Promise.resolve()).then(fn, fn); writeChains.set(key, p.catch(() => {})); return p; }

function kindOf(file) {

  if (/^image\/(jpeg|png|webp|gif)$/.test(file.type)) return "image";
  if (file.type.startsWith("text/") || /\.(txt|md|markdown)$/.test(n)) return "text";
  return null;
}

async function handleFile(file) {
  if (!S.ready) return alertBox("Nisome is still starting. Try again in a moment.");

  if (kind === "pdf" && (!window.pdfjsLib || !window.pdfjsWorker)) return alertBox("The PDF reader didn't load. Check your connection and reload the page.");
  if (kind === "docx" && !window.mammoth) return alertBox("The Word reader didn't load. Check your connection and reload the page.");

  if (file.size > MAX_FILE_MB * 1024 * 1024) return alertBox(`Files can be up to ${MAX_FILE_MB} MB in the browser. Split large books into volumes.`);
  if (!S.sampleOk) return alertBox("AI features need Nisome to be open on claude.ai while signed in.");

  S.processing[id] = { label: "Opening the file…", frac: 0.02 };

  } finally {
    delete S.processing[id];
    refreshDocRows();
    if (S.route === "doc" && S.docId === id) renderDoc();
  }
}

/** Groups page-tagged text into parts that fit comfortably in one request. */
function packPages(pages) {
  const parts = []; let cur = [], size = 0, first = null;
  for (const p of pages) {
    const block = `[p. ${p.n}]\n${p.text.trim()}\n`;
    const b = bytes(block);
    if (cur.length && size + b > CHUNK_BYTES) { parts.push({ label: first === cur.at(-1).n ? `p. ${first}` : `pp. ${first}-${cur.at(-1).n}`, text: cur.map((x) => x.block).join("\n") }); cur = []; size = 0; }
    if (!cur.length) first = p.n;
    cur.push({ n: p.n, block: b > CHUNK_BYTES ? block.slice(0, CHUNK_BYTES / 2) : block }); size += Math.min(b, CHUNK_BYTES);
  }
  if (cur.length) parts.push({ label: first === cur.at(-1).n ? `p. ${first}` : `pp. ${first}-${cur.at(-1).n}`, text: cur.map((x) => x.block).join("\n") });
  return parts;
}
function packText(text) {
  const parts = []; let rest = text.trim(); const max = CHUNK_BYTES / 1.1;
  while (bytes(rest) > CHUNK_BYTES) {
    let cut = rest.lastIndexOf("\n\n", max); if (cut < max * 0.5) cut = rest.lastIndexOf("\n", max); if (cut < max * 0.5) cut = max;
    parts.push(rest.slice(0, cut)); rest = rest.slice(cut).trim();
  }
  if (rest) parts.push(rest);
  return parts.map((t, i, a) => ({ label: a.length === 1 ? "full text" : `part ${i + 1} of ${a.length}`, text: t }));
}

async function imageBlob(source, maxSide = 2000) {
  const bmp = await createImageBitmap(source);
  const scale = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise((r) => c.toBlob(r, "image/jpeg", 0.85));
}

async function processFile(id, file, kind, title) {
  let parts = [], pages = 0, outline = "";
  const imgCaps = S.limits?.images;

  if (kind === "image") {
    if (!imgCaps) throw { code: "images_unavailable" };
    setProgress(id, "Reading your photo…", 0.3);
    const blob = await imageBlob(file);
    const r = await askJSON(summaryInstructions(title, "a photo of study material") + `\nAlso add "transcript": every word of text visible in the image, in reading order, with headings on their own lines. Describe diagrams briefly in [brackets].`, { images: [blob] });
    validateSummary(r);
    parts = [{ label: "photo", text: String(r.transcript || "").slice(0, CHUNK_BYTES) }];
    await saveParts(id, parts);
    await S.store.updateDoc(id, { summary: cleanSummary(r), parts: 1, partLabels: ["photo"], topics: r.topics || [] });
  } else {
    if (kind === "pdf") {
      const data = new Uint8Array(await file.arrayBuffer());
      const pdf = await pdfjsLib.getDocument({ data, isEvalSupported: false }).promise;
      pages = pdf.numPages;
      try { const ol = await pdf.getOutline(); if (ol?.length) outline = ol.slice(0, 80).map((o) => "- " + o.title).join("\n"); } catch {}
      const pageTexts = [];
      for (let n = 1; n <= pages; n++) {
        const page = await pdf.getPage(n);
        const tc = await page.getTextContent();
        let t = ""; for (const it of tc.items) { t += it.str + (it.hasEOL ? "\n" : " "); }
        pageTexts.push({ n, text: t.replace(/[ \t]+/g, " ").replace(/\n{3,}/g, "\n\n") });
        if (n % 10 === 0 || n === pages) setProgress(id, `Reading page ${n} of ${pages}…`, 0.05 + 0.45 * (n / pages));
      }
      // Scanned pages have no text layer: let Claude read the page images.
      const scanned = pageTexts.filter((p) => p.text.trim().length < 40);
      if (scanned.length > pages * 0.3) {
        if (!imgCaps) throw { message: "This PDF is scanned (no text layer), and images can't be sent from this view. Try a PDF with selectable text." };
        const todo = scanned.slice(0, MAX_OCR_PAGES);
        const per = Math.max(1, Math.min(4, imgCaps.maxCount || 1));
        for (let i = 0; i < todo.length; i += per) {
          setProgress(id, `Reading scanned pages ${todo[i].n}-${todo[Math.min(i + per, todo.length) - 1].n}…`, 0.5 + 0.25 * (i / todo.length));
          const batch = todo.slice(i, i + per);
          const imgs = [];
          for (const p of batch) {
            const page = await pdf.getPage(p.n);
            const vp = page.getViewport({ scale: 1.7 });
            const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
            await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
            imgs.push(await new Promise((r) => c.toBlob(r, "image/jpeg", 0.82)));
          }
          const out = await askJSON(`These are scanned pages ${batch.map((p) => p.n).join(", ")} of a medical document, in order. Transcribe all text on each page in reading order. Describe figures briefly in [brackets].
Reply with only JSON: [{"page": <page number>, "text": "<transcript>"}].`, { images: imgs });
          for (const o of Array.isArray(out) ? out : []) { const pt = pageTexts.find((p) => p.n === +o.page); if (pt && o.text) pt.text = String(o.text); }
        }
        if (scanned.length > MAX_OCR_PAGES) alertBox(`This scan has ${scanned.length} pages without text. Nisome read the first ${MAX_OCR_PAGES}; for the rest, upload a PDF with selectable text or split the scan.`);
      }
      parts = packPages(pageTexts.filter((p) => p.text.trim()));
    } else {
      setProgress(id, "Reading the text…", 0.2);
      const text = kind === "docx" ? (await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() })).value : await file.text();
      parts = packText(text);
    }
    if (!parts.length || !parts.some((p) => p.text.trim())) throw { message: "This file has no readable text." };
    setProgress(id, "Saving…", 0.78);
    await saveParts(id, parts);
    setProgress(id, "Writing your summary…", 0.82);
    const r = await askJSON(summaryInstructions(title, pages ? `a ${pages}-page document` : "a document") + "\n\n" + materialForSummary(parts, outline));
    validateSummary(r);
    await S.store.updateDoc(id, { summary: cleanSummary(r), pages, parts: parts.length, partLabels: parts.map((p) => p.label), topics: r.topics || [] });
  }
  setProgress(id, "Writing your first questions…", 0.93);
  S.chunkCache[id] = parts.map((p, i) => ({ i, ...p }));
  const d = S.docs.find((x) => x.id === id) || { id, title };
  await makeQuestions({ ...d, parts: parts.length, partLabels: parts.map((p) => p.label) }, 5, false).catch((e) => console.warn("starter questions", e));
  await S.store.updateDoc(id, { status: "ready", readyAt: Date.now() });
}
async function saveParts(id, parts) {
  for (let i = 0; i < parts.length; i++) await S.store.setChunk(id, i, { i, label: parts[i].label, text: parts[i].text });
  S.chunkCache[id] = parts.map((p, i) => ({ i, ...p }));
}
function materialForSummary(parts, outline) {
  const all = parts.map((p) => p.text).join("\n\n");
  if (bytes(all) < PROMPT_BUDGET - 12000) return `<material>\n${all}\n</material>`;
  // Long work: table of contents plus an even slice of every part.
  const room = PROMPT_BUDGET - 16000 - bytes(outline);
  const each = Math.floor(room / parts.length / 1.1);
  return `This is a long work. Below are ${outline ? "its table of contents and " : ""}excerpts from the start of every part; page markers look like [p. 12].
${outline ? `<contents>\n${outline}\n</contents>\n` : ""}<excerpts>\n${parts.map((p) => `## ${p.label}\n${p.text.slice(0, each)}`).join("\n\n")}\n</excerpts>`;
}
function summaryInstructions(title, what) {
  return `You are Nisome, a study companion for ${levelOf(S.profile)}. Summarize ${what} titled "${title}" for studying. Be accurate and specific, using the material's own terms, numbers and page references (page markers look like [p. 12]).
Reply with only JSON in this shape:
{"title": "a clear title for the material", "overview": "Markdown, 150-300 words", "keyPoints": ["5-10 key points"], "sections": [{"heading": "", "summary": "2-3 sentences", "pages": "e.g. pp. 10-24, or empty"}], "glossary": [{"term": "", "definition": ""}], "topics": ["4-10 short concept names usable as quiz categories"], "videoQueries": ["3-5 short YouTube search phrases for tutorial videos on the main topics"]}`;
}
function validateSummary(r) { if (!r || typeof r !== "object" || !r.overview) throw { code: "invalid_json" }; }
function cleanSummary(r) {
  const arr = (x) => (Array.isArray(x) ? x : []);
  return {
    title: String(r.title || "").slice(0, 200), overview: String(r.overview || ""),
    keyPoints: arr(r.keyPoints).map(String).slice(0, 15),
    sections: arr(r.sections).slice(0, 40).map((s) => ({ heading: String(s.heading || ""), summary: String(s.summary || ""), pages: String(s.pages || "") })),
    glossary: arr(r.glossary).slice(0, 25).map((g) => ({ term: String(g.term || ""), definition: String(g.definition || "") })),
    videoQueries: arr(r.videoQueries).map(String).slice(0, 6),
  };
}

/* ================= finding the right part ================= */
const STOP = new Set("the and for with that this from are was were what which when where how why does into than then them they their there these those your you about have has had not but can will would should could also its it's into over under between within more most less such each other only very".split(" "));
const terms = (s) => (s.toLowerCase().match(/[a-z0-9À-ɏ]{3,}/g) || []).filter((w) => !STOP.has(w));
async function partsFor(d) {
  if (!S.chunkCache[d.id]) S.chunkCache[d.id] = (await S.store.getChunks(d.id)).map((c) => ({ i: c.i, label: c.label, text: c.text }));
  return S.chunkCache[d.id];
}
/** Picks the parts most relevant to `query` that fit within `budget` bytes. */
async function pickParts(d, query, budget, max = 2) {
  const parts = await partsFor(d);
  if (parts.length <= 1) return parts;
  const q = [...new Set(terms(query))];
  if (!q.length) return parts.slice(0, 1);
  const df = {}; const tfs = parts.map((p) => { const tf = {}; for (const w of terms(p.text)) tf[w] = (tf[w] || 0) + 1; for (const w of q) if (tf[w]) df[w] = (df[w] || 0) + 1; return tf; });
  const scored = parts.map((p, i) => ({ p, s: q.reduce((acc, w) => acc + (tfs[i][w] ? (1 + Math.log(tfs[i][w])) * Math.log(1 + parts.length / (df[w] || 1)) : 0), 0) })).sort((a, b) => b.s - a.s);
  const out = []; let used = 0;
  for (const { p, s } of scored) { if (out.length >= max || (out.length && s <= 0)) break; const b = bytes(p.text); if (used + b > budget) continue; out.push(p); used += b; }
  return out.length ? out.sort((a, b) => a.i - b.i) : [parts[0]];
}

/* ================= questions from the material ================= */
async function makeQuestions(d, count, weakOnly) {
  const parts = await partsFor(d);
  const mastery = d.mastery || {};
  const weak = Object.entries(mastery).filter(([, m]) => m.wrong > 0 && m.wrong >= m.right).sort((a, b) => (b[1].wrong - b[1].right) - (a[1].wrong - a[1].right)).map(([c]) => c).slice(0, 5);
  let chosen;
  if (weakOnly && weak.length) chosen = await pickParts(d, weak.join(" "), PROMPT_BUDGET - 20000, 2);
  else { const cur = d.qCursor || 0; chosen = [parts[cur % parts.length]]; }
  const prev = (S.questionsDoc === d.id ? S.questions : []).slice(0, 20).map((q) => "- " + q.question.slice(0, 140)).join("\n");
  const topics = (d.topics || []).slice(0, 30).join("; ");
  const prompt = `You are Nisome, writing study questions for ${levelOf(S.profile)}. Base every question strictly on the material below ("${d.summary?.title || d.title}", ${chosen.map((p) => p.label).join(" and ")}).
Write ${count} questions: about 70% multiple choice and 30% short answer. Test understanding and application, not trivia; use clinical vignettes where the material allows.
Multiple choice: "type": "mcq", exactly 5 "choices", "answerIndex" 0-4 for the single best answer.
Short answer: "type": "short", "choices": [], "answerIndex": -1, answerable in 1-3 sentences.
"modelAnswer": the ideal answer. "explanation": why it is right and why tempting wrong options are wrong, 2-4 sentences. "source": where the answer is, like "p. 42" (page markers look like [p. 42]) or a section heading. "concept": one short concept name${topics ? `, reusing one of these when it fits: ${topics}` : ""}.
${weakOnly && weak.length ? `The learner keeps getting these wrong; target them from new angles: ${weak.join("; ")}.` : ""}
${prev ? `Don't repeat these earlier questions:\n${prev}` : ""}
Reply with only JSON: {"questions": [{"type": "", "question": "", "choices": [], "answerIndex": 0, "modelAnswer": "", "explanation": "", "source": "", "concept": ""}]}

<material>
${chosen.map((p) => p.text).join("\n\n")}
</material>`;
  const r = await askJSON(prompt);
  const list = (Array.isArray(r?.questions) ? r.questions : []).filter((q) => q && q.question && (q.type === "short" || (Array.isArray(q.choices) && q.choices.length === 5 && q.answerIndex >= 0 && q.answerIndex <= 4)));
  if (!list.length) throw { code: "invalid_json" };
  const now = Date.now();
  for (const [k, q] of list.entries()) {
    await S.store.addQuestion(d.id, {
      type: q.type === "short" ? "short" : "mcq", question: String(q.question), choices: q.type === "short" ? [] : q.choices.map(String),
      answerIndex: q.type === "short" ? -1 : +q.answerIndex, modelAnswer: String(q.modelAnswer || ""), explanation: String(q.explanation || ""),
      source: String(q.source || ""), concept: (String(q.concept || "").trim() || "General").slice(0, 80),
      box: 0, dueAt: now, attempts: 0, createdAt: now + (list.length - k), // newest first, batch in order
    });
  }
  if (!(weakOnly && weak.length)) await serial(d.id, () => S.store.updateDoc(d.id, { qCursor: (d.qCursor || 0) + 1 }));
  return list.length;
}

async function recordAnswer(d, q, answer, verdict, feedback, correction) {
  const box = verdict === "correct" ? Math.min(q.box + 1, INTERVAL_DAYS.length - 1) : verdict === "partial" ? q.box : 0;
  const delay = verdict === "incorrect" ? 10 * 60000 : Math.max(1, INTERVAL_DAYS[box]) * DAY;
  await serial("q" + q.id, () => S.store.updateQuestion(d.id, q.id, { box, dueAt: Date.now() + delay, attempts: (q.attempts || 0) + 1, lastAnswer: answer, lastVerdict: verdict, lastFeedback: feedback, lastCorrection: correction, answeredAt: Date.now() }));
  const cur = (S.docs.find((x) => x.id === d.id)?.mastery || {})[q.concept] || { right: 0, wrong: 0 };
  const next = verdict === "correct" ? { right: cur.right + 1, wrong: cur.wrong } : { right: cur.right, wrong: cur.wrong + 1 };
  await serial(d.id, () => S.store.updateDoc(d.id, { mastery: { [q.concept]: next } }));
}

function watchQuestions(id) {
  if (S.unsubQ) S.unsubQ();
  S.questionsDoc = id; S.questions = [];
  S.unsubQ = S.store.watchQuestions(id, (list) => { S.questions = list; if (S.route === "doc" && S.docId === id) { const d = currentDoc(); if (d) renderQuizPane(d); } }, () => {});
}

function renderQuizPane(d) {
  const pane = $("#pane-quiz"); if (!pane) return;
  const now = Date.now();
  const isDue = (q) => (q.dueAt || 0) <= now;
  const list = S.questions.filter((q) => isDue(q) || S.pinned.has(q.id));
  list.forEach((q) => S.pinned.add(q.id));
  const dueCount = S.questions.filter(isDue).length;
  const hasWeak = Object.values(d.mastery || {}).some((m) => m.wrong > 0 && m.wrong >= m.right);
  const filter = pane.dataset.filter || "due";
  const shown = filter === "due" ? list : S.questions;
  if (!$("#q-list")) {
    pane.innerHTML = `<div class="stack">
      <div class="chips" id="q-filters"></div>
      <div id="q-list" class="stack"></div>
      <p class="err small" id="q-err" hidden></p>
      <div class="row"><button class="btn" data-act="more-q" data-focus="next">5 new questions</button><button class="btn ghost" data-act="more-q" data-focus="weak" id="weak-btn">Practice my weak spots</button></div>
      <p class="muted small">New questions appear here as soon as they're written. Missed questions come back in 10 minutes; correct ones after 1, 3, 7, 16 and 35 days.</p></div>`;
  }
  $("#q-filters").innerHTML = `<button class="chip" data-act="q-filter" data-f="due" aria-pressed="${filter === "due"}">To answer (${dueCount})</button><button class="chip" data-act="q-filter" data-f="all" aria-pressed="${filter === "all"}">All (${S.questions.length})</button>`;
  $("#weak-btn").hidden = !hasWeak;
  const box = $("#q-list");
  if (!shown.length) { box.innerHTML = `<div class="card"><b>${S.questions.length ? "All caught up" : "No questions yet"}</b><p class="muted small" style="margin:4px 0 0">${S.questions.length ? "Questions you miss come back here when they're due." : "Generate questions from this material below."}</p></div>`; return; }
  // Update cards in place so typing and local results survive live updates.
  const want = shown.map((q) => q.id);
  [...box.children].forEach((el) => { if (!el.dataset.q || !want.includes(el.dataset.q)) el.remove(); });
  let prev = null;
  for (const q of shown) {
    const key = [q.attempts, q.lastVerdict, q.dueAt].join("|");
    let el = box.querySelector(`[data-q="${CSS.escape(q.id)}"]`);
    if (!el) { el = document.createElement("div"); el.dataset.q = q.id; el.className = "q"; }
    if (el.dataset.key !== key || el.dataset.local !== localKey(q.id)) { el.innerHTML = questionHTML(d, q); el.dataset.key = key; el.dataset.local = localKey(q.id); }
    if (prev ? prev.nextSibling !== el : box.firstChild !== el) box.insertBefore(el, prev ? prev.nextSibling : box.firstChild);
    prev = el;
  }
}
const localKey = (qid) => { const s = S.qState[qid]; return s ? [s.picked, !!s.grade, s.busy, s.err].join("|") : ""; };

function questionHTML(d, q) {
  const st = S.qState[q.id] || {};
  const due = (q.dueAt || 0) <= Date.now();
  const shown = st.grade || (!due && q.lastVerdict ? { verdict: q.lastVerdict, feedback: q.lastFeedback, correction: q.lastCorrection } : null);
  const picked = st.picked ?? (shown && typeof q.lastAnswer === "number" ? q.lastAnswer : null);
  const verdictText = { correct: "Correct", partial: "Partly right", incorrect: "Not quite" };
  return `<div class="meta"><span class="concept">${esc(q.concept)}</span>${q.source ? `<span class="muted">· ${esc(q.source)}</span>` : ""}${due && q.attempts ? `<span class="due">· Due for review</span>` : ""}</div>
    <p class="stem">${esc(q.question)}</p>
    ${q.type === "mcq" ? `<div class="stack" style="gap:8px">${q.choices.map((c, i) => {
      const cls = shown ? (i === q.answerIndex ? "right" : i === picked ? "wrong" : "") : "";
      return `<button class="choice ${cls}" data-act="mcq" data-qid="${esc(q.id)}" data-i="${i}" ${shown ? "disabled" : ""}><span class="k">${LETTERS[i]}</span><span>${esc(c)}</span></button>`; }).join("")}</div>`
    : !shown ? `<textarea rows="3" data-qtext="${esc(q.id)}" placeholder="Type your answer" aria-label="Your answer">${esc(st.text || "")}</textarea>
      <div class="row"><button class="btn" data-act="short" data-qid="${esc(q.id)}" ${st.busy ? "disabled" : ""}>${st.busy ? "Checking…" : "Check my answer"}</button></div>`
    : `<p class="muted small" style="margin:0"><i>Your answer: ${esc(st.text || q.lastAnswer || "")}</i></p>`}
    ${st.err ? `<p class="err small">${esc(st.err)}</p>` : ""}
    ${shown ? `<div class="result">
      <span class="verdict ${shown.verdict}">${verdictText[shown.verdict] || ""}</span>
      ${shown.correction ? `<div class="correction"><b>Correction:</b> ${esc(shown.correction)}</div>` : ""}
      ${shown.feedback && shown.feedback !== q.explanation ? `<div>${esc(shown.feedback)}</div>` : ""}
      <div class="md">${md(q.explanation)}</div>
      ${q.type === "short" ? `<div class="muted small"><b>Model answer:</b> ${esc(q.modelAnswer)}</div>` : ""}
      <span class="muted small">${shown.verdict === "incorrect" ? "Nisome will ask this again in about 10 minutes." : shown.verdict === "partial" ? "You'll see this again tomorrow." : "Next review is scheduled further out."}</span>
      <div class="row"><button class="btn ghost" data-act="discuss" data-qid="${esc(q.id)}">Ask Nisome about this</button></div></div>` : ""}`;
}

async function answerMcq(qid, i) {
  const d = currentDoc(); const q = S.questions.find((x) => x.id === qid); if (!d || !q) return;
  const verdict = i === q.answerIndex ? "correct" : "incorrect";
  const correction = verdict === "incorrect" ? `The correct answer is ${LETTERS[q.answerIndex]}: ${q.choices[q.answerIndex]}.` : "";
  S.qState[qid] = { picked: i, grade: { verdict, feedback: q.explanation, correction } };
  renderQuizPane(d);
  recordAnswer(d, q, i, verdict, q.explanation, correction).catch((e) => { S.qState[qid].err = "Couldn't save this answer: " + errText(e); renderQuizPane(d); });
}
async function answerShort(qid) {
  const d = currentDoc(); const q = S.questions.find((x) => x.id === qid); if (!d || !q) return;
  const st = (S.qState[qid] = S.qState[qid] || {});
  const text = (st.text || "").trim(); if (!text) return;
  st.busy = true; st.err = null; renderQuizPane(d);
  try {
    const g = await askJSON(`Grade ${levelOf(S.profile)}'s answer to a study question. Be fair: accept correct answers in different words; mark "partial" when the core idea is right but something important is missing or slightly wrong.
"feedback": 1-3 sentences to the learner, starting with what they got right. "correction": if not fully correct, state the correct answer plainly and fix any misconception; otherwise "".
Reply with only JSON: {"verdict": "correct" | "partial" | "incorrect", "feedback": "", "correction": ""}

Question: ${q.question}
Model answer: ${q.modelAnswer}
Explanation: ${q.explanation}
Learner's answer: ${text}`, { modelTier: "quick" });
    const verdict = ["correct", "partial", "incorrect"].includes(g?.verdict) ? g.verdict : "incorrect";
    st.grade = { verdict, feedback: String(g?.feedback || ""), correction: String(g?.correction || "") };
    st.busy = false; renderQuizPane(d);
    await recordAnswer(d, q, text, verdict, st.grade.feedback, st.grade.correction);
  } catch (e) { st.busy = false; st.err = errText(e); renderQuizPane(d); }
}

    key, placeholder: `Ask about "${d.summary?.title || d.title}"…`,
    empty: `<div class="stack"><h2>Ask about this material</h2><p class="muted" style="margin:0">Answers come from your file, with page references. Try explaining a concept in your own words: Nisome will tell you if anything is wrong and correct it.</p>
      <div class="stack" style="gap:8px">${(d.summary?.keyPoints || []).slice(0, 3).map((k) => `<button class="choice" data-act="chat-starter" data-key="${esc(key)}" data-text="${esc("Explain this in more depth: " + k)}"><span>Explain: ${esc(k)}</span></button>`).join("")}</div></div>`,
    respond: async (turns, onText, signal) => {
      const doc = currentDoc() || d;
      const lastUser = turns[turns.length - 1].content;
      const prevUser = turns.length >= 3 ? turns[turns.length - 3].content : "";
      const history = trimTurns(turns, 30000);
      const s = doc.summary || {};
      const overview = `Overview of the whole work:\n${s.overview || ""}\nSections:\n${(s.sections || []).map((x) => `- ${x.heading} (${x.pages}): ${x.summary}`).join("\n")}`.slice(0, 12000);
      const used = bytes(overview) + history.reduce((a, t) => a + bytes(t.content), 0) + 4000;
      const parts = await pickParts(doc, prevUser + " " + lastUser, PROMPT_BUDGET - used, 2);
      const rules = `You are Nisome, a study companion for ${levelOf(S.profile)}. You are discussing their uploaded material, "${s.title || doc.title}". The excerpts below (${parts.map((p) => p.label).join(", ")}) and the overview are your main source. Page markers look like [p. 12].
Ground answers in the material and cite where you found things, like (p. 42). If the material doesn't cover something, say so, then answer from general medical knowledge and label that part clearly.
Whenever the learner answers a question or states something as fact, check it. If it's wrong or partly wrong, say so plainly, give the correct version, and explain why, kindly and without hedging.
Use Markdown. Keep answers focused, and end with one short follow-up question that checks understanding when it helps.

${overview}

<excerpts>
${parts.map((p) => p.text).join("\n\n")}
</excerpts>`;
      const r = await ask([{ role: "user", content: rules }, ...history], { onText, signal });
      return { text: r.text, note: parts.length ? "From " + parts.map((p) => p.label).join(", ") : "" };
    },
  });
}
function trimTurns(turns, maxBytes) {
  let out = turns.slice(); while (out.length > 1 && out.reduce((a, t) => a + bytes(t.content), 0) > maxBytes) out = out.slice(2);
  if (out[0]?.role !== "user") out = out.slice(1);
  return out;
}

const chatCfg = {};
function mountChat(container, cfg) {
  chatCfg[cfg.key] = cfg;
  S.chats[cfg.key] = S.chats[cfg.key] || [];
  container.innerHTML = `<div class="chat" data-chat="${esc(cfg.key)}">
    ${cfg.head || ""}
    <div class="thread" data-thread></div>
    <form class="composer" data-act-form="chat" data-key="${esc(cfg.key)}">
      <textarea rows="1" placeholder="${esc(cfg.placeholder)}" aria-label="Message" data-chat-input></textarea>
      <button class="btn" type="submit" data-send>${cfg.sendLabel || "Send"}</button>
    </form>
    ${cfg.foot || ""}</div>`;
  paintThread(cfg.key);
}
function chatEl(key) { return document.querySelector(`[data-chat="${CSS.escape(key)}"]`); }
function paintThread(key) {
  const el = chatEl(key); if (!el) return;
  const cfg = chatCfg[key]; const turns = S.chats[key];
  const visible = turns.slice(cfg.hidden || 0);
  const th = el.querySelector("[data-thread]");
  th.innerHTML = visible.length ? visible.map((t) => t.role === "user" ? `<div class="msg user"><div class="bubble">${esc(t.content)}</div></div>`
    : `<div class="msg"><div class="av">N</div><div class="body"><div class="md">${md(t.content)}</div>${t.note ? `<div class="src">${esc(t.note)}</div>` : ""}</div></div>`).join("") : cfg.empty || "";
}
const ctl = {};
async function sendChat(key, text) {
  const cfg = chatCfg[key]; if (!cfg) return;
  const v = (text || "").trim(); if (!v) return;
  if (ctl[key]) return;
  const turns = S.chats[key];
  if (turns.length && turns[turns.length - 1].role === "user") turns.pop(); // an earlier failed send
  turns.push({ role: "user", content: v });
  paintThread(key);
  const el = chatEl(key); const th = el.querySelector("[data-thread]");
  const bot = document.createElement("div"); bot.className = "msg"; bot.innerHTML = `<div class="av">N</div><div class="body"><div class="md"><span class="thinking">Thinking…</span></div></div>`;
  th.appendChild(bot); bot.scrollIntoView({ block: "nearest" });
  const box = bot.querySelector(".md");
  const send = el.querySelector("[data-send]"); send.textContent = "Stop";
  ctl[key] = new AbortController();
  try {
    const r = await cfg.respond(turns.map(({ role, content }) => ({ role, content })), ({ text }) => { box.innerHTML = md(text); }, ctl[key].signal);
    turns.push({ role: "assistant", content: r.text, note: r.note });
  } catch (e) {
    if (e?.text) turns.push({ role: "assistant", content: e.text });
    paintThread(key);
    if (e?.code !== "cancelled") chatEl(key)?.querySelector("[data-thread]").insertAdjacentHTML("beforeend", `<p class="err small">${esc(errText(e))}</p>`);
    return;
  } finally { delete ctl[key]; const s = chatEl(key)?.querySelector("[data-send]"); if (s) s.textContent = cfg.sendLabel || "Send"; }
  paintThread(key);
  chatEl(key)?.querySelector(".msg:last-child")?.scrollIntoView({ block: "nearest" });
}

    return sendChat("doc:" + S.docId, `Help me understand this question from my material.\n\n${q.question}${q.type === "mcq" ? "\n" + q.choices.map((c, i) => `${LETTERS[i]}. ${c}`).join("\n") : ""}\n\nMy answer: ${q.type === "mcq" && typeof mine === "number" ? LETTERS[mine] : mine}`);
  }
  if (a === "part-summary") {
    const d = currentDoc(); const out = $("#part-out"); const i = +t.dataset.i;
    out.innerHTML = `<p class="thinking">Summarizing ${esc(d.partLabels?.[i] || "this part")}…</p>`;
    try {
      const part = (await partsFor(d))[i];
      await ask(`Summarize this part (${part.label}) of "${d.summary?.title || d.title}" in detail for ${levelOf(S.profile)}: the main ideas, key facts and numbers, with page references. Use Markdown headings and bullets, 250-450 words.\n\n<material>\n${part.text}\n</material>`, { cache: { gcTime: 86400000 }, onText: ({ text }) => { out.innerHTML = `<div class="card md">${md(text)}</div>`; } });
    } catch (x) { out.innerHTML = `<p class="err small">${esc(errText(x))}</p>`; }
    return;
  }
  if (a === "chat-starter") return sendChat(t.dataset.key, t.dataset.text);
  if (a === "chat-reset") { S.chats[t.dataset.key] = []; ctl[t.dataset.key]?.abort(); return paintThread(t.dataset.key); }
  if (a === "tutor-subj") { tutorSubject = t.dataset.s; document.querySelectorAll('[data-act="tutor-subj"]').forEach((b) => b.setAttribute("aria-pressed", b.dataset.s === tutorSubject)); return; }
  if (a === "prac-mode") { S.practice.mode = t.dataset.m; return renderPractice(); }
  if (a === "prac-subj") { S.practice.subject = t.dataset.s; document.querySelectorAll('[data-act="prac-subj"]').forEach((b) => b.setAttribute("aria-pressed", b.dataset.s === S.practice.subject)); return; }
  if (a === "bank-pick") {
    const P = S.practice; const q = P.q || EXAMPLE_Q; if (P.picked !== null) return; P.picked = +t.dataset.i;
    if (!q.example) { P.score.total++; if (P.picked === q.answer) P.score.right++; try { localStorage.setItem("nisome-score", JSON.stringify(P.score)); } catch {} }
    return renderBank();
  }
  if (a === "bank-new") return newBankQuestion();
  if (a === "bank-reset") { S.practice.score = { right: 0, total: 0 }; try { localStorage.setItem("nisome-score", JSON.stringify(S.practice.score)); } catch {} return renderBank(); }
  if (a === "case-start") { ctl.case?.abort(); S.chats.case = []; paintThread("case"); t.textContent = "New case"; return sendChat("case", "Start a new case now."); }
  if (a === "case-dx") { const i = chatEl("case")?.querySelector("[data-chat-input]"); if (i) { if (!i.value.startsWith("DIAGNOSIS:")) i.value = "DIAGNOSIS: " + i.value; i.focus(); } return; }
  if (a === "vq") { videoQuery = t.dataset.q; return renderVideos(); }
  if (a === "edit-profile") { ob = { ...S.profile }; return renderOnboarding(); }
  if (a === "ob-role") { ob.role = t.dataset.role; ob.name = $("#ob-name")?.value ?? ob.name; return renderOnboarding(); }
  if (a === "ob-uni") { $("#ob-uni").value = t.dataset.name; const c = $("#ob-country"); if (c && !c.value) c.value = t.dataset.country; $("#ob-sugg").innerHTML = ""; return; }
  if (a === "ob-cancel") { ob = null; return render(); }
  if (a === "wipe") {
    $("#wipe-confirm").innerHTML = `<div class="banner bad stack"><span>Delete all ${S.docs.length} documents with their questions and progress? This can't be undone.</span><div class="row"><button class="btn danger" data-act="wipe-yes">Delete everything</button><button class="btn quiet" data-act="wipe-no">Cancel</button></div></div>`; return;
  }
  if (a === "wipe-no") { $("#wipe-confirm").innerHTML = ""; return; }
  if (a === "wipe-yes") { t.disabled = true; t.textContent = "Deleting…"; for (const d of [...S.docs]) await S.store.deleteDoc(d.id).catch(() => {}); S.chunkCache = {}; $("#wipe-confirm").innerHTML = `<p class="muted small">Your library was deleted.</p>`; return; }
});
document.addEventListener("submit", (e) => {
  const f = e.target;
  if (f.id === "ob-form") { e.preventDefault(); return saveOnboarding(); }
  if (f.dataset.actForm === "chat") {
    e.preventDefault(); const key = f.dataset.key;
    if (ctl[key]) { ctl[key].abort(); return; }
    const i = f.querySelector("[data-chat-input]"); const v = i.value; i.value = ""; sendChat(key, v); return;
  }
  if (f.dataset.actForm === "video") { e.preventDefault(); const v = $("#vq").value.trim(); if (v.length > 1) { videoQuery = v; renderVideos(); } }
});
document.addEventListener("keydown", (e) => {
  if (e.target.matches?.("[data-chat-input]") && e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); e.target.form.requestSubmit(); }
});
document.addEventListener("input", (e) => {
  const id = e.target.dataset?.qtext; if (id) { (S.qState[id] = S.qState[id] || {}).text = e.target.value; }
  if (e.target.id === "socratic") socratic = e.target.checked;
});
document.addEventListener("change", (e) => { if (e.target.id === "socratic") socratic = e.target.checked; });
$("#file").addEventListener("change", (e) => { const f = e.target.files?.[0]; e.target.value = ""; if (f) handleFile(f); });

/* ================= start ================= */
let unsubDocs = null;
function startDocsWatch() {
  if (unsubDocs) unsubDocs();
  S.docsLoaded = false;
  const timer = setTimeout(() => { if (!S.docsLoaded) { S.docsLoaded = true; render(); } }, 10000);
  unsubDocs = S.store.watchDocs((list) => {
    clearTimeout(timer); S.docs = list; S.docsLoaded = true;
    if (S.route === "library") refreshDocRows(); else if (S.route === "doc") renderDoc(); else if (S.route === "videos" && !$("#vq")?.matches(":focus")) renderVideos();
  }, () => { clearTimeout(timer); S.docsLoaded = true; render(); });
}

(async function boot() {
  readRoute();
  render();
  const [sample, db, user] = await Promise.all([samplePromise, use("db"), use("user")]);
  S.sampleOk = !!sample;
  S.limits = sample ? await sample.limits().catch(() => null) : null;
  S.db = db; S.user = user;
  S.uid = user ? await user.id().catch(() => null) : null;
  if (user) { try { S.meName = (await user.me()).name || ""; } catch {} }
  S.store = db && S.uid ? dbStore(db, S.uid) : memoryStore();
  S.saved = S.store.kind === "db";
  try { S.profile = await S.store.getProfile(); } catch { S.store = memoryStore(); S.saved = false; }
  startDocsWatch();
  S.ready = true;
  render();
})();
</script>
